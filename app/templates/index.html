<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brewsite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Brewsite</h1>
        <p>Discover local breweries and favorite beer styles.</p>
    </header>

    <main>
        <section class="brewery-list">
            {% for brewery in breweries %}
            <article class="brewery-card">
                <h2>{{ brewery.name }}</h2>
                <p><strong>City:</strong> {{ brewery.city }}</p>
                <p><strong>State:</strong> {{ brewery.state }}</p>
                <p><strong>Style:</strong> {{ brewery.style }}</p>
            </article>
            {% endfor %}
        </section>
    </main>
</body>
</html>
